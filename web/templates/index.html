<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Clipper</title>
<style>
  :root{
    --bg:#0d0d0f; --surface:#161618; --surface-2:#1d1d20; --line:#2a2a2e;
    --text:#f4f4f5; --mute:#9a9aa2; --accent:#d62828; --accent-hi:#e84b4b;
    --ok:#5fcf80; --err:#ff7a7a; --focus:#7cc4ff;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
       font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:48px 20px 80px}

  /* Centered title, no gradient, deliberate underline accent */
  header{text-align:center;margin-bottom:36px}
  h1{margin:0;font-size:38px;font-weight:800;letter-spacing:-0.02em}
  h1 .bar{display:block;width:56px;height:4px;background:var(--accent);
          border-radius:2px;margin:14px auto 0}

  section{margin-bottom:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
  h2{margin:0 0 18px;font-size:13px;font-weight:700;letter-spacing:.08em;
     text-transform:uppercase;color:var(--mute)}

  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
           clip:rect(0,0,0,0);white-space:nowrap;border:0}
  fieldset{border:0;margin:0;padding:0}
  fieldset+fieldset{margin-top:18px}
  legend{padding:0}
  label{display:block;font-size:13px;color:var(--mute);margin-bottom:7px}

  input[type=text],input[type=email],input[type=number],select{
    width:100%;padding:11px 13px;background:var(--surface-2);border:1px solid var(--line);
    border-radius:8px;color:var(--text);font-size:15px;font-family:inherit}
  input::placeholder{color:#6b6b73}
  input:focus,select:focus{outline:none;border-color:var(--accent-hi)}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}

  /* Dropzone: flat, bordered, keyboard-operable via the input inside the label */
  .drop{display:flex;flex-direction:column;align-items:center;gap:6px;
        border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;
        cursor:pointer;color:var(--mute);background:var(--surface-2);transition:border-color .15s}
  .drop:hover{border-color:#3a3a40}
  .drop.hot{border-color:var(--accent-hi);background:#d6282810}
  .drop:focus-within{outline:3px solid var(--focus);outline-offset:2px}
  .drop svg{stroke:var(--mute);margin-bottom:4px}
  .drop b{color:var(--text)}
  .or{display:flex;align-items:center;gap:12px;color:var(--mute);font-size:12px;
      letter-spacing:.15em;margin:16px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:16px}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row>div:first-child{flex:1;min-width:200px}

  button{padding:11px 18px;border:0;border-radius:8px;font-size:15px;font-weight:600;
         cursor:pointer;font-family:inherit;background:var(--accent);color:#fff;transition:background .15s}
  button:hover{background:var(--accent-hi)}
  button.secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.secondary:hover{background:var(--surface-2)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .generate{width:100%;margin-top:22px;padding:14px;font-size:16px}

  input[type=range]{accent-color:var(--accent);width:100%}
  progress{width:100%;height:8px;margin-top:18px;border:0;border-radius:4px;
           background:var(--surface-2);overflow:hidden}
  progress::-webkit-progress-bar{background:var(--surface-2)}
  progress::-webkit-progress-value{background:var(--accent);border-radius:4px}
  progress::-moz-progress-bar{background:var(--accent)}

  .stage{margin-top:10px;color:var(--mute);font-size:14px}
  .msg{margin-top:10px;font-size:14px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .pill{display:inline-block;padding:4px 11px;border-radius:6px;background:var(--surface-2);
        border:1px solid var(--line);font-size:13px;color:var(--text)}
  .checkbox{display:flex;align-items:center;gap:8px;color:var(--text);font-size:14px;margin-top:12px}
  .checkbox input{width:auto;accent-color:var(--accent)}

  .results{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-top:8px}
  .hero{grid-column:1/-1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .hero h4{margin:0 0 10px;font-size:13px;color:var(--muted, #9a9a9a);font-weight:600;letter-spacing:.04em}
  .hero img{max-width:100%;max-height:420px;border-radius:10px;border:1px solid var(--line);display:block;margin:0 auto}
  video{width:100%;border-radius:10px;background:#252525;aspect-ratio:9/16;object-fit:cover;border:1px solid var(--line)}
  .dl{display:block;text-align:center;margin-top:8px;color:#5ab0ff;font-size:14px}
  .meta{width:100%;margin-top:8px;padding:8px;background:var(--surface-2);border:1px solid var(--line);
        border-radius:8px;color:var(--text);font-size:12px;font-family:inherit;resize:vertical}
  a{color:#5ab0ff}
</style>
</head>
<body>
<a href="#main" class="sr-only">Skip to main content</a>
<div class="wrap">
  <header>
    <h1>Shorts Clipper<span class="bar" aria-hidden="true"></span></h1>
  </header>

  <main id="main">
    <!-- Account -->
    <section class="card" aria-labelledby="acc-h">
      <h2 id="acc-h">Account</h2>
      <form id="account-form" class="row" novalidate>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email"
                 placeholder="you@example.com" required aria-describedby="acc-msg">
        </div>
        <div>
          <button type="submit">Sign in / Create</button>
        </div>
      </form>
      <label class="checkbox"><input type="checkbox" id="newsletter"> Email me product updates</label>
      <p id="acc-status" class="msg" role="status" aria-live="polite"></p>
      <p id="acc-msg" class="msg err" role="alert" aria-live="assertive"></p>

      <form id="redeem-form" class="row" style="margin-top:14px" novalidate>
        <div>
          <label for="code">Promo code</label>
          <input type="text" id="code" name="code" placeholder="Have a code? Enter it" aria-describedby="redeem-msg">
        </div>
        <div>
          <button type="submit" class="secondary">Redeem</button>
        </div>
      </form>
      <p id="redeem-msg" class="msg" role="alert" aria-live="assertive"></p>
    </section>

    <!-- Source + options -->
    <section class="card" aria-labelledby="make-h">
      <h2 id="make-h">Make clips</h2>
      <form id="clip-form" novalidate>
        <fieldset>
          <legend class="sr-only">Video source</legend>
          <label class="drop" id="drop" for="file">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/>
            </svg>
            <span><b>Drag &amp; drop</b> a video file, or browse</span>
            <span id="fname" class="pill" hidden></span>
            <input type="file" id="file" name="file" accept="video/*" class="sr-only">
          </label>
          <p class="or" aria-hidden="true">OR</p>
          <label for="url">YouTube URL</label>
          <input type="text" id="url" name="url" inputmode="url"
                 placeholder="https://youtube.com/watch?v=...">
        </fieldset>

        <fieldset>
          <legend class="sr-only">Clip options</legend>
          <div class="grid">
            <div><label for="max_clips">Number of clips</label>
              <input type="number" id="max_clips" name="max_clips" value="5" min="1" max="20"></div>
            <div><label for="clip_len">Length (seconds)</label>
              <input type="number" id="clip_len" name="clip_len" value="45" min="10" max="90"></div>
            <div><label for="layout">Layout</label>
              <select id="layout" name="layout">
                <option value="full">Full video</option>
                <option value="crop">Motion track</option>
                <option value="split">Split screen (facecam)</option>
              </select></div>
            <div><label for="peak_pos">Build-up: <span id="ppv">65</span>%</label>
              <input type="range" id="peak_pos" name="peak_pos" min="40" max="85" value="65"
                     aria-describedby="ppv"></div>
          </div>
        </fieldset>

        <fieldset>
          <legend class="sr-only">Caption</legend>
          <label for="caption">Caption (optional)</label>
          <input type="text" id="caption" name="caption" placeholder="e.g. INSANE PENTAKILL">
          <div class="grid">
            <div><label for="cap_size">Caption size</label>
              <input type="number" id="cap_size" name="cap_size" value="66" min="24" max="140"></div>
            <div><label for="platform">Title/caption for</label>
              <select id="platform" name="platform">
                <option value="youtube">YouTube</option>
                <option value="tiktok">TikTok</option>
                <option value="both">Both</option>
              </select></div>
          </div>
          <label class="checkbox"><input type="checkbox" id="subtitles" name="subtitles">
            Dynamic spoken-word captions (auto-transcribed)</label>
          <!-- Caption position is set automatically by layout: split = bottom of the
               facecam, full video = right under the video. Skipped if the source is
               already captioned. -->
        </fieldset>

        <button type="submit" id="go" class="generate">Generate clips</button>
      </form>

      <progress id="bar" max="100" value="0" hidden aria-label="Processing progress"></progress>
      <p id="stage" class="stage" role="status" aria-live="polite"></p>
      <p id="form-msg" class="msg err" role="alert" aria-live="assertive"></p>
    </section>

    <!-- Results -->
    <section aria-labelledby="res-h">
      <h2 id="res-h" class="sr-only">Generated clips</h2>
      <div class="results" id="results" tabindex="-1"></div>
    </section>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const api = (url, body) => fetch(url, {method:'POST', headers:{'Content-Type':'application/json'},
  body: JSON.stringify(body)}).then(r => r.json().then(j => ({ok:r.ok, j})));

let chosenFile = null, signedIn = false;

// --- account state ---
function renderUser(u){
  signedIn = true;
  const left = u.remaining === null ? 'Unlimited' : `${u.remaining} left this month`;
  $('acc-status').textContent = `Signed in as ${u.email} · ${u.plan} plan · ${left}`;
}
fetch('/me').then(r=>r.json()).then(u=>{ if(!u.anonymous) renderUser(u); });

$('account-form').addEventListener('submit', async e => {
  e.preventDefault(); $('acc-msg').textContent='';
  const {ok, j} = await api('/account', {email:$('email').value.trim(), newsletter:$('newsletter').checked});
  if(ok){ renderUser(j); } else { $('acc-msg').textContent = j.error || 'Sign-in failed.'; }
});

$('redeem-form').addEventListener('submit', async e => {
  e.preventDefault(); $('redeem-msg').textContent='';
  const {ok, j} = await api('/redeem', {code:$('code').value.trim()});
  $('redeem-msg').className = 'msg ' + (ok?'ok':'err');
  $('redeem-msg').textContent = ok ? j.message : (j.error || 'Could not redeem.');
  if(ok && j.user) renderUser(j.user);
});

// --- file drop (keyboard accessible via the native input inside the label) ---
const drop = $('drop');
$('file').addEventListener('change', e => setFile(e.target.files[0]));
['dragover','dragenter'].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => {e.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop', e => setFile(e.dataTransfer.files[0]));
function setFile(f){ chosenFile=f; const n=$('fname'); n.hidden=!f; n.textContent=f?f.name:''; }
$('peak_pos').addEventListener('input', e => $('ppv').textContent = e.target.value);

// --- generate ---
$('clip-form').addEventListener('submit', async e => {
  e.preventDefault();
  $('form-msg').textContent=''; $('results').innerHTML='';
  if(!signedIn){ $('form-msg').textContent='Enter your email above to create an account first.'; $('email').focus(); return; }
  if(!chosenFile && !$('url').value.trim()){ $('form-msg').textContent='Add a YouTube URL or a video file.'; return; }

  const fd = new FormData($('clip-form'));
  fd.set('peak_pos', ($('peak_pos').value/100).toFixed(2));
  if(chosenFile) fd.set('file', chosenFile);

  $('go').disabled=true; $('bar').hidden=false; $('bar').value=0;
  const r = await fetch('/process', {method:'POST', body:fd});
  const j = await r.json();
  if(!r.ok){ $('form-msg').textContent=j.error||'Request failed.'; $('go').disabled=false; $('bar').hidden=true; return; }
  poll(j.job_id);
});

function poll(id){
  const t = setInterval(async () => {
    const s = await (await fetch('/status/'+id)).json();
    $('stage').textContent = s.stage || '';
    if(typeof s.progress === 'number') $('bar').value = s.progress;
    if(s.done){
      clearInterval(t); $('go').disabled=false;
      if(s.error){ $('form-msg').textContent = s.stage; $('bar').hidden=true; return; }
      $('bar').value=100;
      // One hero thumbnail for the whole video, shown prominently above the clips.
      if(s.thumb){
        const h = document.createElement('div');
        h.className = 'hero';
        const cap = document.createElement('h4');
        cap.textContent = 'Hero thumbnail';
        const hi = document.createElement('img');
        hi.src = '/clips/' + s.thumb;
        hi.alt = 'Auto-generated hero thumbnail for this video';
        hi.loading = 'lazy';
        const ha = document.createElement('a');
        ha.className = 'dl'; ha.href = '/clips/' + s.thumb; ha.download = '';
        ha.textContent = 'Download thumbnail';
        h.append(cap, hi, ha);
        $('results').appendChild(h);
      }
      (s.clips||[]).forEach((name,i) => {
        const d = document.createElement('div');
        const v = document.createElement('video');
        v.src='/clips/'+name; v.controls=true; v.muted=true; v.playsInline=true;
        v.setAttribute('aria-label', `Generated clip ${i+1} preview`);
        const a = document.createElement('a');
        a.className='dl'; a.href='/clips/'+name; a.download='';
        a.textContent = `Download clip ${i+1}`;
        // Show the generated title/caption from the .txt sidecar (same name, .txt)
        const meta = document.createElement('textarea');
        meta.className='meta'; meta.readOnly=true; meta.rows=5;
        meta.setAttribute('aria-label', `Title and caption for clip ${i+1}`);
        fetch('/clips/'+name.replace(/\.mp4$/, '.txt'))
          .then(r => r.ok ? r.text() : '').then(txt => { meta.value = txt.trim(); });
        d.append(v, a, meta); $('results').appendChild(d);
      });
      $('stage').textContent = `Done. ${ (s.clips||[]).length } clips ready.`;
      $('results').focus();
    }
  }, 1200);
}
</script>
</body>
</html>
